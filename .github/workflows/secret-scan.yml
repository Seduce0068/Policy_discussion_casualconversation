name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Betterleaks
        run: go install github.com/betterleaks/betterleaks@v1.10.1

      - name: Scan full Git history
        run: |
          set -eu
          bin="$(go env GOPATH)/bin/betterleaks"
          out="$("$bin" git . 2>&1)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'no leaks found' || {
            echo 'Betterleaks detected a credential in the repository history.' >&2
            exit 1
          }
